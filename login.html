<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Masuk</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4F46E5,#7C3AED 60%,#C026D3);font-family:'Plus Jakarta Sans',sans-serif}form{width:min(340px,88vw);background:#fff;border-radius:24px;padding:28px 22px;box-shadow:0 20px 40px rgba(30,27,75,.35);color:#1E1B4B}h1{margin:0 0 4px;font-size:22px;font-weight:800}p{margin:0 0 18px;font-size:13px;color:#475569}label{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:4px}input{width:100%;box-sizing:border-box;height:48px;border:1px solid #C7D2FE;border-radius:12px;padding:0 14px;font-weight:600;font-size:15px;font-family:inherit;background:#F8F7FF}button{width:100%;height:50px;margin-top:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#4ADE80,#15803D);color:#fff;font:800 15px 'Plus Jakarta Sans',sans-serif}#err{color:#991B1B;font-size:13px;font-weight:700;margin-top:10px;min-height:18px}</style></head><body><form id="f"><h1>Wali Kelas</h1><p>UPT SMP Negeri 40 Kota Makassar</p><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required><button type="submit">Masuk</button><div id="err" role="alert"></div></form><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Gagal masuk');await fetch('/api/init');location.href='index.html'}catch(x){err.textContent=x.message}}</script></body></html>
